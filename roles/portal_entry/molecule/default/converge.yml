---
- name: "Converge"
  hosts: "all"
  pre_tasks:
    - name: "Get LDAP base DN from UCR"
      ansible.builtin.command: "ucr get ldap/base"
      register: "portal_entry_ucr_ldap_base"
      changed_when: false
  roles:
    - role: "univention.ucs_roles.portal_entry"
      vars:
        portal_entry_base_dn: "{{ portal_entry_ucr_ldap_base.stdout }}"
        portal_entry_entries: []
