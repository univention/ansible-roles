---
# tasks file for portal-create-category

- name: "Create portal category"
  ansible.builtin.command: >
    udm portals/category create
    --ignore_exists
    --position cn=category,{{ portal_create_category_portal_dn }}
    {% for lang, text in (category['display_name']|default({})).items() %}
    --append displayName='{{ lang }} "{{ text }}"'
    {% endfor %}
    --set name='{{ category['name'] }}'
  loop: "{{ [portal_create_category_categories|selectattr('state', 'defined')|selectattr('state', 'equalto', 'present')|list|default([])|flatten,
      portal_create_category_categories|selectattr('state', 'undefined')|list|default([])|flatten]|flatten }}"
  loop_control:
    loop_var: "category"
  when: ('only' not in category) or
        ('only' in category and
          portal_create_category_install_list|intersect([category['only']]|flatten)
        )
  tags:
    - portal_create_category
    - portal_create_category_add_category

- name: "Append category to portal categories list"
  ansible.builtin.command:
    argv:
      - "udm"
      - "portals/portal"
      - "modify"
      - "--dn"
      - "cn=domain,cn=portal,{{ portal_create_category_portal_dn }}"
      - "--append"
      - "categories=cn={{ category['name'] }},cn=category,{{ portal_dn }}"
  loop: "{{ portal_create_category_categories|selectattr('state', 'equalto', 'present')|default([])|flatten }}"
  loop_control:
    loop_var: "category"
  tags:
    - portal_create_category
    - portal_create_category_append_category
