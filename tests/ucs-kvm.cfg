[Global]
logfile: autotest.log

kvm_server: [ENV:KVM_BUILD_SERVER]
kvm_user: [ENV:KVM_USER]
kvm_extra_label: [ENV:JOB_BASE_NAME]-[ENV:UCS_VERSION]

kvm_operating_system: UCS
kvm_template: generic-unsafe
kvm_ucsversion: [ENV:UCS_VERSION]
kvm_architecture: amd64

kvm_dhcp: 1
kvm_interface: eth0

parallel: false

[primary]

command1:
 PUT /setup/ssh_ansible_key.pub /root/.ssh/authorized_keys
 chmod 600 /root/.ssh/authorized_keys
 LOCAL echo "primary ansible_host=[primary_IP]" >> "inventory.ini"
command2:
 . utils.sh && basic_setup
 ucr set updater/identify="UCS (EC2 Test)"
command3:
 ucr set repository/online/server="https://updates-test.software-univention.de"
command4:
 reboot
 LOCAL sleep 40
