include:
  - project: "univention/customers/dataport/dps/helper/ci-tooling"
    ref: "main"
    file: ".gitlab-ci-ansible.yml"

stages:
  - ".pre"
  - "prepare"
  - "release"
  - "publish"

variables:
  DISABLE_LINT: "false"

.combine_read: &combine_read
  - |
    ROLE_FILES=$(find roles/ -type f -name README.md)

    # Generate table of modules
    echo "" >> README.md
    echo "# Modules" >> README.md
    echo "" >> README.md
    for f in ${ROLE_FILES}
    do
      ROLE=$(echo ${f} | cut -d "/" -f2)
      echo "- [${ROLE}](https://github.com/univention/ansible-roles#$(echo ${f} | sed "s@\.@@g" | sed "s@/@@g" | tr '[:upper:]' '[:lower:]'))" >> README.md
    done
    # Add content of modules
    for f in ${ROLE_FILES}
    do
      ROLE=$(echo ${f} )
      echo "" >> README.md
      echo "---" >> README.md
      echo "" >> README.md
      echo "# ${ROLE}" >> README.md
      echo "" >> README.md
      cat ${f} >> README.md
    done

.publish-common:
  artifacts:
    paths:
      - univention-ucs_roles-*
    expire_in: 14 days
  before_script:
    # Check if release has to be build
    - if [ -z "$RELEASE_VERSION" ]; then exit 0; fi
    - *combine_read
    # Set new semantic-release version
    - if [[ ${CI_COMMIT_BRANCH} != "main" ]];
      then
        VERSION=${RELEASE_VERSION}-dev${CI_PIPELINE_IID};
      else
        VERSION=${RELEASE_VERSION};
      fi
    - sed -i "/version. \"[0-9]\.[0-9]\.[0-9]\"/s/[0-9]\.[0-9]\.[0-9]/$VERSION/" galaxy.yml
  image: artifacts.knut.univention.de/upx/container-tooling/automation-ansible:main-41a9520a
  script:
    - ansible-galaxy collection build
    - ansible-galaxy collection publish --api-key ${ANSIBLE_GALAXY_API_KEY} univention-ucs_roles-${VERSION}.tar.gz
  stage: publish
  variables:
    GIT_DEPTH: "1"

publish-main:
  extends: .publish-common
  only:
    - main

publish-mr:
  except:
    - main
    - tags
  extends: .publish-common
  when: manual

update-requirements:
  image: artifacts.knut.univention.de/upx/container-tooling/automation-mr-tool:main-41a9520a
  only:
    - tags
  script:
    - curl --insecure --request POST  --form token=${TRIGGER_TOKEN_BASE}  --form ref=main  --form variables[GALAXY_RELEASE_VERSION]=${CI_COMMIT_TAG} ${CI_SERVER_URL}/api/v4/projects/408/trigger/pipeline
    - curl --insecure --request POST  --form token=${TRIGGER_TOKEN_SPS}  --form ref=main  --form variables[GALAXY_RELEASE_VERSION]=${CI_COMMIT_TAG} ${CI_SERVER_URL}/api/v4/projects/398/trigger/pipeline
  stage: prepare
  variables:
    GIT_STRATEGY: none

sync-to-public-repo:
  dependencies: []
  image: artifacts.knut.univention.de/upx/container-tooling/automation-rsync:main-41a9520a
  before_script:
    # Include univention CA certificate
    - curl -k https://nissedal.knut.univention.de/ucs-root-ca.crt > /usr/local/share/ca-certificates/ucs-root-ca.crt
    - update-ca-certificates
    # Update README
    - *combine_read
  script:
    - rm -rf ${CI_BUILDS_DIR}/public || true
    - git clone https://gitlab-ci-token:${GITLAB_ANSIBLE_ROLES_PUBLIC_TOKEN}@git.knut.univention.de/univention/customers/dataport/deployment/ansible-roles-public.git ${CI_BUILDS_DIR}/public
    - rsync -aq --delete --exclude .gitlab-ci.yml --exclude .git ${CI_PROJECT_DIR}/ ${CI_BUILDS_DIR}/public
    - cd ${CI_BUILDS_DIR}/public
    - git add .
    - git config user.email "ucs@univention.de"
    - git config user.name "Univention Commit Service"
    - git commit -am "Release $RELEASE_VERSION ($(date +'%d.%m.%Y'))"
    - git push
  stage: publish
  only:
    - main
