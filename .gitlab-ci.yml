.common-semantic-release:
  before_script:
    - curl -k https://nissedal.knut.univention.de/ucs-root-ca.crt > /usr/local/share/ca-certificates/ucs-root-ca.crt
    - update-ca-certificates
  image: artifacts.knut.univention.de/upx/container-tooling/automation-semantic-release:${CI_COMMIT_REF_SLUG}
  stage: prepare
  variables:
    GIT_STRATEGY: clone
    NODE_EXTRA_CA_CERTS: "/usr/local/share/ca-certificates/ucs-root-ca.crt"

prepare:
  artifacts:
    reports:
      dotenv: ${CI_PROJECT_DIR}/deploy.env
  except:
    - tags
  extends: .common-semantic-release
  script:
    - echo RELEASE_VERSION=$(semantic-release --dry-run --branches $CI_COMMIT_REF_NAME --plugins "@semantic-release/gitlab,@semantic-release/release-notes-generator" | grep -oP "Published release [0-9]+\.[0-9]+\.[0-9]+ on" | grep -oP "[0-9]+\.[0-9]+\.[0-9]+") > ${CI_PROJECT_DIR}/deploy.env
    - cat ${CI_PROJECT_DIR}/deploy.env
  stage: prepare

release:
  extends: .common-semantic-release
  only:
    - main
  script:
    - semantic-release --branches $CI_COMMIT_REF_NAME --plugins "@semantic-release/gitlab"
  stage: release

publish:
  artifacts:
    paths:
      - univention-ucs_roles-*
    expire_in: 14 days
  before_script:
    - sed -i "/version. [0-9]\.[0-9]\.[0-9]/s/[0-9]\.[0-9]\.[0-9]/$RELEASE_VERSION/" galaxy.yml
  image: artifacts.knut.univention.de/upx/container-tooling/automation-ansible:main
  only:
    - tags
  script:
    - ansible-galaxy collection publish --api-key ${ANSIBLE_GALAXY_API_KEY} .
    - ansible-galaxy collection build
  stage: publish
  variables:
    GIT_DEPTH: "1"