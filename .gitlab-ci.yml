include:
  - project: 'univention/customers/dataport/deployment/ci-tooling'
    ref: main
    file: '.gitlab-ci-ansible.yml'

stages:
  - .pre
  - prepare
  - release
  - publish


.combine_read: &combine_read
  - |
    ROLE_FILES=$(find roles/ -type f -name README.md)

    # Generate table of modules
    echo "" >> README.md
    echo "# Modules" >> README.md
    echo "" >> README.md
    for f in ${ROLE_FILES}
    do
      ROLE=$(echo ${f} | cut -d "/" -f2)
      echo "- [${ROLE}](#$(echo ${f} | sed "s@\.@@g" | sed "s@/@@g" | tr '[:upper:]' '[:lower:]'))" >> README.md
    done
    # Add content of modules
    for f in ${ROLE_FILES}
    do
      ROLE=$(echo ${f} )
      echo "" >> README.md
      echo "---" >> README.md
      echo "" >> README.md
      echo "# ${ROLE}" >> README.md
      echo "" >> README.md
      cat ${f} >> README.md
    done

.publish-common:
  artifacts:
    paths:
      - univention-ucs_roles-*
    expire_in: 14 days
  before_script:
    # Check if release has to be build
    - if [ -z "$RELEASE_VERSION" ]; then exit 0; fi
    - *combine_read
    # Set new semantic-release version
    - if [[ ${CI_COMMIT_BRANCH} != "main" ]];
      then
        VERSION=${RELEASE_VERSION}-dev${CI_PIPELINE_IID};
      else
        VERSION=${RELEASE_VERSION};
      fi
    - sed -i "/version. [0-9]\.[0-9]\.[0-9]/s/[0-9]\.[0-9]\.[0-9]/$VERSION/" galaxy.yml
    # Download license client
    - curl https://raw.githubusercontent.com/univention/univention-corporate-server/5.0-0/test/ucs-test/univention/testing/license_client.py --output ${CI_PROJECT_DIR}/roles/configure_license/files/license_client.py
  image: artifacts.knut.univention.de/upx/container-tooling/automation-ansible:main-b05ef2b4
  script:
    - ansible-galaxy collection build
    - ansible-galaxy collection publish --api-key ${ANSIBLE_GALAXY_API_KEY} univention-ucs_roles-${VERSION}.tar.gz
  stage: publish
  variables:
    GIT_DEPTH: "1"

publish-main:
  extends: .publish-common
  only:
    - main

publish-mr:
  except:
    - main
    - tags
  extends: .publish-common
  when: manual

update-requirements:
  image: artifacts.knut.univention.de/upx/container-tooling/automation-mr-tool:main-b05ef2b4
  only:
    - tags
  script:
    - curl --insecure --request POST  --form token=${TRIGGER_TOKEN_BMI}  --form ref=main  --form variables[GALAXY_RELEASE_VERSION]=${CI_COMMIT_TAG} ${CI_SERVER_URL}/api/v4/projects/402/trigger/pipeline
    - curl --insecure --request POST  --form token=${TRIGGER_TOKEN_SANDBOX}  --form ref=main  --form variables[GALAXY_RELEASE_VERSION]=${CI_COMMIT_TAG} ${CI_SERVER_URL}/api/v4/projects/396/trigger/pipeline
    - curl --insecure --request POST  --form token=${TRIGGER_TOKEN_SPS}  --form ref=main  --form variables[GALAXY_RELEASE_VERSION]=${CI_COMMIT_TAG} ${CI_SERVER_URL}/api/v4/projects/398/trigger/pipeline
    - curl --insecure --request POST  --form token=${TRIGGER_TOKEN_ZITSH}  --form ref=main  --form variables[GALAXY_RELEASE_VERSION]=${CI_COMMIT_TAG} ${CI_SERVER_URL}/api/v4/projects/399/trigger/pipeline
  stage: prepare
  variables:
    GIT_STRATEGY: none
