include:
  - project: 'univention/customers/dataport/deployment/ci-tooling'
    ref: main
    file: '.gitlab-ci-ansible.yml'

stages:
  - .pre
  - prepare
  - release
  - publish

.publish-common:
  artifacts:
    paths:
      - univention-ucs_roles-*
    expire_in: 14 days
  before_script:
    # Set new semantic-release version
    - if [[ ${CI_COMMIT_BRANCH} != "main" ]];
      then
        VERSION=${RELEASE_VERSION}-dev${CI_PIPELINE_IID};
      else
        VERSION=${RELEASE_VERSION};
      fi
    - sed -i "/version. [0-9]\.[0-9]\.[0-9]/s/[0-9]\.[0-9]\.[0-9]/$VERSION/" galaxy.yml
    # Download license client
    - curl https://raw.githubusercontent.com/univention/univention-corporate-server/5.0-0/test/ucs-test/univention/testing/license_client.py --output ${CI_PROJECT_DIR}/roles/configure_license/files/license_client.py
  image: artifacts.knut.univention.de/upx/container-tooling/automation-ansible:main
  script:
    - ansible-galaxy collection build
    - ansible-galaxy collection publish --api-key ${ANSIBLE_GALAXY_API_KEY} univention-ucs_roles-${RELEASE_VERSION}.tar.gz
  stage: publish
  variables:
    GIT_DEPTH: "1"

publish-main:
  extends: .publish-common
  only:
    - main

publish-mr:
  extends: .publish-common
  rules:
    - if: '${RELEASE_VERSION} =~ /^./'
      when: manual
    - if: '${CI_COMMIT_BRANCH} =~ /^main$/'
      when: never
    - if: '${CI_COMMIT_TAG}'
      when: never